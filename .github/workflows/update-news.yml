name: Daily news update

# This is the "constant daily update" mechanism for ARES. It runs on GitHub's
# own servers (not this dev environment, which has no general outbound
# internet), so it can freely reach public RSS feeds. It fetches the feeds
# configured in scripts/feeds.config.mjs, rewrites data/news/*.json, and
# commits the result straight to the default branch.
#
# Requirements: none beyond this file — the feeds used are free public RSS,
# no API keys/secrets needed. Runs 4x/day; adjust the cron below to taste.
#
# IMPORTANT: scheduled workflows only run once this file lives on the
# repository's default branch. Merge this branch to activate it, or trigger
# it manually via the "Run workflow" button (workflow_dispatch, below) to
# test it beforehand.

on:
  schedule:
    - cron: "0 */6 * * *" # 00:00, 06:00, 12:00, 18:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-news
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Fetch latest news
        run: npm run fetch-news

      - name: Commit and push if data changed
        run: |
          git config user.name "ares-news-bot"
          git config user.email "actions@users.noreply.github.com"
          if git diff --quiet -- data/news; then
            echo "No news changes to commit."
            exit 0
          fi
          git add data/news
          git commit -m "chore: automated news refresh [skip ci]"
          git push
